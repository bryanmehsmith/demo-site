name: Deploy

on:
  push:
    branches: [main]

# Rapid pushes to main (e.g. several demo-repo "bump" commits landing within
# seconds of each other) each start their own independent run. Without this,
# their `az containerapp update` calls race, and whichever run happens to
# finish last wins the deploy -- even if it was for an older commit. Cancelling
# any in-progress run for the same branch when a newer push arrives guarantees
# only the latest commit's run ever reaches that step.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - run: python -m unittest discover tests

      - uses: astral-sh/setup-uv@v3

      - run: uv sync --all-packages
      - run: uv run pytest

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest

      # One-time setup required before this step works:
      #   az ad app create / federated-credential for GitHub OIDC, then store
      #   AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID as repo secrets,
      #   plus AZURE_RESOURCE_GROUP / AZURE_CONTAINERAPP_NAME as repo variables.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: |
          az containerapp update \
            --name ${{ vars.AZURE_CONTAINERAPP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.IMAGE }}:${{ github.sha }}
