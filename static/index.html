<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bryan Smith / Demos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A small collection of proof-of-concept demos by Bryan Smith, including a JSE momentum factor backtest.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23fffdf9'/%3E%3Ctext x='50' y='66' font-family='Helvetica Neue,Arial,sans-serif' font-size='40' font-weight='700' fill='%237a4f22' text-anchor='middle'%3EBS%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --background-color: #faf8f5;
    --text-color: #2b2722;
    --muted-text: #615950;
    --link-color: #7a4f22;
    --link-hover: #513313;
    --border-color: #ded5ca;
    --shadow-color: rgba(50, 38, 25, 0.08);
    --shadow-soft: 0 2px 8px var(--shadow-color);
    --card-background: #fffdf9;
    --subtle-surface: #f5efe7;
    --accent-color: #7a4f22;
    --footer-background: #f5efe7;
    --radius: 10px;
    --radius-lg: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --background-color: #11100e;
      --text-color: #f4efe7;
      --muted-text: #c7bba9;
      --link-color: #d0a46a;
      --link-hover: #f0c88f;
      --border-color: #39342d;
      --shadow-color: rgba(0, 0, 0, 0.24);
      --card-background: #1c1a17;
      --subtle-surface: #232019;
      --accent-color: #d0a46a;
      --footer-background: #171512;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--background-color);
    color: var(--text-color);
    font-family: "Aptos", "Helvetica Neue", sans-serif;
    line-height: 1.6;
  }

  a { color: var(--link-color); text-decoration: none; }
  a:hover, a:focus-visible { color: var(--link-hover); }

  .header {
    background: var(--card-background);
    border-bottom: 1px solid var(--border-color);
    padding: 28px 16px;
  }

  .header-content { max-width: 940px; margin: 0 auto; }

  h1 {
    margin: 0;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    letter-spacing: -0.03em;
    line-height: 1.05;
  }

  .tagline { margin: 10px 0 0; color: var(--muted-text); font-size: 1.02rem; }

  main { max-width: 940px; margin: 0 auto; padding: 36px 16px 48px; }

  .demos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .card {
    display: block;
    background: var(--card-background);
    border: 1px solid var(--border-color);
    border-left: 4px solid var(--accent-color);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
    padding: 20px 22px;
    color: inherit;
    text-decoration: none;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }

  .card:hover, .card:focus-visible {
    box-shadow: 0 4px 14px var(--shadow-color);
    transform: translateY(-1px);
    outline: none;
  }

  .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .card-name { font-size: 1.08rem; font-weight: 650; }

  .tag {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted-text);
    background: var(--subtle-surface);
    border: 1px solid var(--border-color);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }

  .card-desc { margin: 10px 0 0; color: var(--muted-text); font-size: 0.9rem; }
  .card-cta { display: inline-block; margin-top: 14px; color: var(--link-color); font-size: 0.85rem; font-weight: 600; }

  footer {
    background: var(--footer-background);
    border-top: 1px solid var(--border-color);
    padding: 18px 16px;
    text-align: center;
    color: var(--muted-text);
    font-size: 0.85rem;
  }

  @media (max-width: 720px) {
    .header { padding: 22px 16px; }
    main { padding: 28px 16px 36px; }
  }
</style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <h1>Demos</h1>
      <p class="tagline">A few small proof-of-concept builds by Bryan Smith.</p>
    </div>
  </header>

  <main>
    <div class="demos">
      <a class="card" href="/demos/momentum-factor/">
        <div class="card-head">
          <span class="card-name">Momentum Factor</span>
          <span class="tag">streamlit</span>
        </div>
        <p class="card-desc">JSE 12-1 month momentum factor backtest: a long-only top-quantile portfolio, rebalanced monthly.</p>
        <span class="card-cta">View demo &rarr;</span>
      </a>
    </div>
  </main>

  <footer>
    <a href="https://github.com/bryanmehsmith/demo-site">Source on GitHub</a>
  </footer>
</body>
</html>
